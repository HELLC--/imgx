name: Release @imgx-kit/core to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @imgx-kit/core
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'core-v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches package.json version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#core-v}"
          PKG_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match packages/core/package.json version ($PKG_VERSION)."
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @imgx-kit/core
        run: pnpm --filter @imgx-kit/core build

      - name: Run tests
        run: pnpm --filter @imgx-kit/core test

      - name: Publish to npm (with provenance)
        working-directory: packages/core
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
